[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "load-storage"
version = "0.1.0"
description = "Causal next-day household load forecasting and storage dispatch experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.1,<3",
  "PuLP>=3.2,<4",
  "matplotlib>=3.9,<4",
]

[project.scripts]
load-storage = "load_storage.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/load_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::RuntimeWarning"]
